name: Update REAME

on:
  schedule:
    - cron: "* */12 * * *"
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    name: Update Profile README

    steps:
      - uses: actions/checkout@v2.336.0

      - uses: Readme-Workflows/recent-activity@v2.336.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
